# WebSocket endpoint uses default HTTP port 8080.
quarkus.http.port=8081
# Local dev infra defaults from dev-setup.md
app.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
app.neo4j.username=${NEO4J_USER:neo4j}
app.neo4j.password=${NEO4J_PASSWORD:devpassword}
app.consistency.check-enabled=${ARCHIMESH_CONSISTENCY_CHECK:false}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.prefix=${KAFKA_TOPIC_PREFIX:archimesh.model}
kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:archimesh-server}
kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
app.authz.enabled=${ARCHIMESH_AUTHZ_ENABLED:false}
app.identity.mode=${ARCHIMESH_IDENTITY_MODE:bootstrap}
app.identity.proxy.user-header=${ARCHIMESH_PROXY_USER_HEADER:X-Forwarded-User}
app.identity.proxy.roles-header=${ARCHIMESH_PROXY_ROLES_HEADER:X-Forwarded-Roles}
app.authz.admin-role=${ARCHIMESH_AUTHZ_ADMIN_ROLE:admin}
app.authz.reader-role=${ARCHIMESH_AUTHZ_READER_ROLE:model_reader}
app.authz.writer-role=${ARCHIMESH_AUTHZ_WRITER_ROLE:model_writer}
app.authz.admin-role-aliases=${ARCHIMESH_AUTHZ_ADMIN_ROLE_ALIASES:}
app.authz.reader-role-aliases=${ARCHIMESH_AUTHZ_READER_ROLE_ALIASES:}
app.authz.writer-role-aliases=${ARCHIMESH_AUTHZ_WRITER_ROLE_ALIASES:}
app.audit.websocket.actions=${ARCHIMESH_AUDIT_WEBSOCKET_ACTIONS:WebSocketOpenRejected,WebSocketJoin,WebSocketMessageRejected,WebSocketClosed}
app.audit.websocket.verbose=${ARCHIMESH_AUDIT_WEBSOCKET_VERBOSE:false}
quarkus.oidc.enabled=${ARCHIMESH_QUARKUS_OIDC_ENABLED:false}
quarkus.keycloak.devservices.enabled=false
# App logs default to INFO, set ARCHIMESH_LOG_LEVEL=DEBUG for detailed flow tracing.
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."org.gautelis.archimesh".level=${ARCHIMESH_LOG_LEVEL:INFO}
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."org.neo4j.driver".level=WARN

# Bound the amount of checkpoint-covered operation history removed by one admin request.
app.compaction.max-batches-per-run=${ARCHIMESH_COMPACTION_MAX_BATCHES:100}
